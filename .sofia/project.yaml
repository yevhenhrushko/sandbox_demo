# .sofia/project.yaml — Project Manifest for SOFIA (design §2.11).
schema_version: 1
project:
  name: sandbox-demo
  description: "Sandbox for SOFIA demo tasks; the first one is a static HTML page with a weather forecast for Kyiv"
repo:
  host: github
  slug: yevhenhrushko/sandbox_demo
  base_branch: main
publish:
  branch_prefix: sofia/
  draft: true
paths:
  allowed: [site/, tests/]
  tests: [tests/]
checks:
  - name: unit
    run: python3 -m pytest -q tests --junitxml=reports/junit.xml
    junit: reports/*.xml
    timeout_min: 10
    before_code: true
scenarios:
  required: [success]
quality:
  max_function_lines: 80
  max_complexity: 15
  max_duplicate_lines: 12
  max_change_lines: 600
review:
  checklist:
    matches-requirements: the page does what each requirement says, nothing more
    readable-page: the page is readable on a phone and a desktop width, no broken layout
    tests-meaningful: each new test checks a requirement and fails if the page breaks it
    no-network: the page and the tests make no network calls; the data is in the page
mutants:
  enabled: false
autonomy:
  floors: {}
git:
  submodules_allowed: false
