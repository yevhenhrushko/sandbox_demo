# .sofia/project.yaml — Project Manifest for SOFIA (design §2.11).
schema_version: 1
project:
  name: sandbox-demo
  description: Sandbox for SOFIA demo tasks (first: one static HTML page with a weather forecast for Kyiv)
repo:
  host: github
  slug: yevhenhrushko/sandbox_demo
  base_branch: main
publish:
  branch_prefix: sofia/
  draft: true
paths:
  allowed: [site/, tests/]
  tests: [tests/]
checks:
  - name: unit
    run: python3 -m pytest -q tests --junitxml=reports/junit.xml
    junit: reports/*.xml
    timeout_min: 10
    before_code: true
scenarios:
  required: [success]
quality:
  max_function_lines: 80
  max_complexity: 15
  max_duplicate_lines: 12
  max_change_lines: 600
mutants:
  enabled: false
autonomy:
  floors: {}
git:
  submodules_allowed: false
